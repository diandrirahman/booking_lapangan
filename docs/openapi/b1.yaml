openapi: 3.1.0
info:
  title: LapanganGo Phase B2 API
  version: 2.0.0
  description: Kontrak kumulatif B1 dan B2 untuk runtime lokal sandbox LapanganGo.
x-lapangango-global-json-responses:
  "413":
    $ref: "#/components/responses/PayloadTooLarge"
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Venues
  - name: Bookings
  - name: Payments
  - name: Business
  - name: Admin
  - name: Finance
  - name: Reviews
  - name: Support
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      responses:
        "200":
          description: Dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /media:
    get:
      tags: [Venues]
      operationId: getPublicMedia
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
            minLength: 10
            maxLength: 255
      responses:
        "302":
          description: Redirect to a short-lived download URL for a public media asset.
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
            Cache-Control:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User and session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications:
    get:
      tags: [Auth]
      operationId: listNotifications
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Notification feed for the active customer account.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AccountNotification" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications/{notificationId}/read:
    patch:
      tags: [Auth]
      operationId: markNotificationRead
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PublicId" }
      responses:
        "204": { description: Notification marked as read. }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications/read-all:
    post:
      tags: [Auth]
      operationId: markAllNotificationsRead
      responses:
        "204": { description: All account notifications marked as read. }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        "204":
          description: Session ended.
  /auth/google/link/start:
    post:
      tags: [Auth]
      operationId: startGoogleAccountLink
      summary: Reauthenticate and start Google account linking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: Short-lived Google authorization URL.
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl: { type: string, format: uri }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/InternalError"
  /me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        "200":
          description: Active identity and workspaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /venues:
    get:
      tags: [Venues]
      operationId: searchVenues
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - name: area
          in: query
          schema: { type: string, maxLength: 120 }
        - name: cityCode
          in: query
          schema: { type: string, maxLength: 10 }
        - name: sport
          in: query
          schema: { type: string }
        - name: facilities
          in: query
          description: Daftar slug fasilitas dipisahkan koma; seluruh fasilitas wajib tersedia.
          schema: { type: string }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: time
          in: query
          schema: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        - name: minimumPrice
          in: query
          schema: { type: integer, minimum: 0 }
        - name: maximumPrice
          in: query
          schema: { type: integer, minimum: 0 }
        - name: indoorOutdoorType
          in: query
          schema: { type: string, enum: [INDOOR, OUTDOOR, MIXED] }
        - name: paymentMode
          in: query
          schema: { type: string, enum: [FULL, DP, PAY_AT_VENUE] }
        - name: hasPromo
          in: query
          schema: { type: boolean }
        - name: minimumRating
          in: query
          schema: { type: number, minimum: 0, maximum: 5 }
        - name: latitude
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: maximumDistanceKm
          in: query
          schema: { type: number, exclusiveMinimum: 0, maximum: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [RELEVANT, NEAREST, PRICE_LOWEST, RATING_HIGHEST, POPULAR, NEWEST]
            default: RELEVANT
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenuePage"
  /venues/{slug}:
    get:
      tags: [Venues]
      operationId: getVenue
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PublicId" }
      responses:
        "200":
          description: Venue detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "404":
          $ref: "#/components/responses/NotFound"
  /availability:
    get:
      tags: [Venues]
      operationId: getAvailability
      parameters:
        - name: courtId
          in: query
          required: true
          schema: { $ref: "#/components/schemas/BookingReference" }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Authoritative slots and price previews.
          content:
            application/json:
              schema:
                type: object
                required: [items, version]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AvailabilitySlot" }
                  version: { type: integer }
  /bookings:
    get:
      tags: [Bookings]
      operationId: listCustomerBookings
      responses:
        "200":
          description: Bookings owned by the authenticated customer.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CustomerBookingSummary" }
    post:
      tags: [Bookings]
      operationId: createBookingHold
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingInput"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201":
          description: Booking hold created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /bookings/{bookingId}:
    get:
      tags: [Bookings]
      operationId: getBooking
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Booking snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"
  /payment-attempts:
    post:
      tags: [Payments]
      operationId: createPaymentAttempt
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingId, kind]
              properties:
                bookingId: { $ref: "#/components/schemas/BookingReference" }
                kind:
                  type: string
                  enum: [FULL, DP, RESERVATION, BALANCE]
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201":
          description: Sandbox payment attempt created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentAttempt"
  /payment-attempts/{attemptId}:
    get:
      tags: [Payments]
      operationId: getPaymentAttempt
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Payment attempt snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentAttempt"
  /payment-attempts/{attemptId}/simulate:
    post:
      tags: [Payments]
      operationId: simulatePaymentAttempt
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [success, pending, failed, expired] }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "204": { description: Sandbox result accepted. }
  /business/workspaces:
    get:
      tags: [Business]
      operationId: listWorkspaces
      responses:
        "200":
          description: Active business workspaces for the current identity.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /business/tenants:
    post:
      tags: [Business]
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 3, maxLength: 80 }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201":
          description: Draft tenant and Primary Owner membership created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /business/pricing-rules:
    post:
      tags: [Business]
      operationId: createPriceRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePriceRuleInput" }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201":
          description: Price rule created after overlap validation.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { $ref: "#/components/schemas/PublicId" }
  /business/venues/{venueId}/media/signed-upload:
    post:
      tags: [Business]
      operationId: createVenueSignedUpload
      parameters:
        - $ref: "#/components/parameters/VenueId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSignedUploadInput" }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201":
          description: Short-lived object storage upload URL scoped to an Owner venue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedUpload" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/audit:
    get:
      tags: [Admin]
      operationId: listAdminAudit
      parameters:
        - name: cursor
          in: query
          schema: { $ref: "#/components/schemas/PublicId" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: action
          in: query
          schema: { type: string, maxLength: 64 }
        - name: resourceType
          in: query
          schema: { type: string, maxLength: 32 }
        - name: tenantId
          in: query
          schema: { $ref: "#/components/schemas/PublicId" }
        - name: venueId
          in: query
          schema: { $ref: "#/components/schemas/PublicId" }
        - name: actorUserId
          in: query
          schema: { $ref: "#/components/schemas/PublicId" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Immutable platform activity explorer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /business/pricing-preview:
    post:
      tags: [Business]
      operationId: previewPricing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PricingPreviewInput" }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: Resolved price and selected rule for every sample.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPreviewResult" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/masters:
    get:
      tags: [Admin]
      operationId: getAdminMasters
      responses:
        "200":
          description: Platform master configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMasters" }
  /admin/masters/{kind}:
    post:
      tags: [Admin]
      operationId: createAdminNamedMaster
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [sport, facility] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 50 }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201": { description: Master option created. }
  /admin/masters/{kind}/{id}:
    patch:
      tags: [Admin]
      operationId: updateAdminNamedMaster
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [sport, facility] }
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PublicId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "204": { description: Master active state updated. }
  /admin/masters/durations/{kind}:
    post:
      tags: [Admin]
      operationId: createAdminDurationOption
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [interval, buffer] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 0, maximum: 360 }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201": { description: Duration option created. }
  /admin/masters/payment-options:
    post:
      tags: [Admin]
      operationId: createAdminPaymentOption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, label]
              properties:
                code: { type: string, minLength: 2, maxLength: 24 }
                label: { type: string, minLength: 2, maxLength: 50 }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201": { description: Payment option created. }
  /admin/masters/payment-options/{id}:
    patch:
      tags: [Admin]
      operationId: updateAdminPaymentOption
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PublicId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "204": { description: Payment option active state updated. }
  /business/tenants/transfer-primary-owner:
    post:
      tags: [Business]
      operationId: transferPrimaryOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, targetMembershipId, reason]
              properties:
                tenantId: { $ref: "#/components/schemas/PublicId" }
                targetMembershipId: { $ref: "#/components/schemas/PublicId" }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "204": { description: Primary Owner transferred transactionally. }
  /business/tenants/{tenantId}/members:
    get:
      tags: [Business]
      operationId: listWorkspaceMembers
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant membership and Staff assignments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceMember" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Business]
      operationId: addWorkspaceMember
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [OWNER, STAFF] }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201":
          description: Existing registered user added to workspace.
          content:
            application/json:
              schema:
                type: object
                required: [membershipId]
                properties:
                  membershipId: { $ref: "#/components/schemas/PublicId" }
        "409": { $ref: "#/components/responses/Conflict" }
  /business/tenants/{tenantId}/staff/{membershipId}/assignments:
    put:
      tags: [Business]
      operationId: updateStaffAssignments
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: membershipId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PublicId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueIds, reason]
              properties:
                venueIds:
                  type: array
                  items: { $ref: "#/components/schemas/PublicId" }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "204": { description: Assignments replaced. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /business/setup-masters:
    get:
      tags: [Business]
      operationId: getBusinessSetupMasters
      responses:
        "200":
          description: Active master configuration for venue setup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupMasters" }
  /business/venues:
    get:
      tags: [Business]
      operationId: listBusinessVenues
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
      responses:
        "200":
          description: Venues visible in the active workspace.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/VenueSetupSummary" }
    post:
      tags: [Business]
      operationId: createBusinessVenue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, name]
              properties:
                tenantId: { $ref: "#/components/schemas/PublicId" }
                name: { type: string, minLength: 3, maxLength: 80 }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201":
          description: Private venue draft created.
          content:
            application/json:
              schema:
                type: object
                required: [id, slug]
                properties:
                  id: { $ref: "#/components/schemas/PublicId" }
                  slug: { type: string }
  /business/venues/{venueId}:
    get:
      tags: [Business]
      operationId: getBusinessVenue
      parameters:
        - $ref: "#/components/parameters/VenueId"
        - $ref: "#/components/parameters/TenantIdQuery"
      responses:
        "200":
          description: Complete venue setup read model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueSetupDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /business/venues/{venueId}/profile:
    put:
      tags: [Business]
      operationId: updateBusinessVenueProfile
      parameters:
        - $ref: "#/components/parameters/VenueId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueProfileInput" }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "204": { description: Profile saved. }
  /business/venues/{venueId}/catalog:
    put:
      tags: [Business]
      operationId: updateBusinessVenueCatalog
      parameters:
        - $ref: "#/components/parameters/VenueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, sportIds, facilityIds]
              properties:
                tenantId: { $ref: "#/components/schemas/PublicId" }
                sportIds:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/PublicId" }
                facilityIds:
                  type: array
                  items: { $ref: "#/components/schemas/PublicId" }
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "204": { description: Venue sports and facilities replaced. }
  /business/venues/{venueId}/courts:
    post:
