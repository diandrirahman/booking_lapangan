components:
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 160 }
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PublicId" }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/BookingReference" }
    TenantIdQuery:
      name: tenantId
      in: query
      required: true
      schema: { $ref: "#/components/schemas/PublicId" }
    VenueId:
      name: venueId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PublicId" }
    VenueIdQuery:
      name: venueId
      in: query
      schema: { $ref: "#/components/schemas/PublicId" }
  responses:
    Unauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: The active identity cannot access this workspace resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: State or reservation conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    PayloadTooLarge:
      description: JSON request body exceeds the global 1 MB limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    InternalError:
      description: Internal service error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    B2Object:
      type: object
      additionalProperties: true
    B2List:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/B2Object" }
    PromotionInput:
      type: object
      required:
        [code, name, discountType, discountValue, startsAt, endsAt, fundingSource]
      properties:
        tenantId: { type: [string, "null"] }
        code: { type: string, minLength: 2, maxLength: 40 }
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        discountType: { type: string, enum: [PERCENT, FIXED] }
        discountValue: { type: integer, minimum: 1 }
        minimumAmount: { type: integer, minimum: 0 }
        maximumDiscount: { type: integer, minimum: 1 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        startsAtTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d$" }
        endsAtTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d$" }
        quota: { type: integer, minimum: 1 }
        perUserLimit: { type: integer, minimum: 1, maximum: 100 }
        firstBookingOnly: { type: boolean }
        paymentMethod: { type: string, enum: [FULL, DP, PAY_AT_VENUE] }
        fundingSource: { type: string, enum: [OWNER, PLATFORM] }
        budgetAmount: { type: integer, minimum: 1 }
        scopes:
          type: array
          maxItems: 50
          items:
            type: object
            required: [type, referenceId]
            properties:
              type: { type: string, enum: [VENUE, SPORT, COURT] }
              referenceId: { $ref: "#/components/schemas/PublicId" }
    CommissionConfigInput:
      type: object
      required: [tenantId, rateBasisPoints, effectiveFrom, gatewayFeeFunding, reason]
      properties:
        tenantId: { type: [string, "null"] }
        rateBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time }
        trialDays: { type: integer, minimum: 1 }
        trialCompletedBookingLimit: { type: integer, minimum: 1 }
        gatewayFeeFunding: { type: string, enum: [OWNER, PLATFORM] }
        gatewayFeeBasisPoints:
          { type: integer, minimum: 0, maximum: 10000, default: 250 }
        subsidyBudget: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    TenantRole:
      type: object
      required: [id, name, templateCode, immutable, permissions]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        name: { type: string }
        templateCode: { type: [string, "null"] }
        immutable: { type: boolean }
        permissions:
          type: array
          items: { type: string }
    FinanceSummary:
      type: object
      required:
        [
          sandbox,
          grossRevenue,
          onlineRevenue,
          offlineRevenue,
          totalPaid,
          balanceDue,
          discounts,
          commission,
          refunds,
          pendingBalance,
          availableBalance,
          paidOut,
          netOwnerRevenue,
          dpPaid,
          cashRevenue,
          gatewayFees,
          heldBalance,
          trends,
          venueComparison,
          courtComparison,
        ]
      properties:
        sandbox: { type: boolean, const: true }
        grossRevenue: { type: integer }
        onlineRevenue: { type: integer }
        offlineRevenue: { type: integer }
        totalPaid: { type: integer }
        balanceDue: { type: integer }
        discounts: { type: integer }
        commission: { type: integer }
        refunds: { type: integer }
        pendingBalance: { type: integer }
        availableBalance: { type: integer }
        paidOut: { type: integer }
        netOwnerRevenue: { type: integer }
        dpPaid: { type: integer }
        cashRevenue: { type: integer }
        gatewayFees: { type: integer }
        heldBalance: { type: integer }
        trends:
          type: array
          items:
            type: object
            required: [date, paid]
            properties:
              date: { type: string, format: date }
              paid: { type: integer }
        venueComparison:
          type: array
          items:
            type: object
            required: [venueId, name, paid]
            properties:
              venueId: { $ref: "#/components/schemas/PublicId" }
              name: { type: string }
              paid: { type: integer }
