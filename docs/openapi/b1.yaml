        tenantName: { type: string }
        name: { type: string }
        slug: { type: string }
        addressLine: { type: string }
        status: { type: string }
        publicationStatus: { type: string }
    AdminVerification:
      type: object
      required:
        [
          requestId,
          venueId,
          venueName,
          tenantId,
          tenantName,
          status,
          venueVersion,
          snapshot,
          submittedAt,
        ]
      properties:
        requestId: { $ref: "#/components/schemas/PublicId" }
        venueId: { $ref: "#/components/schemas/PublicId" }
        venueName: { type: string }
        tenantId: { $ref: "#/components/schemas/PublicId" }
        tenantName: { type: string }
        status: { type: string }
        venueVersion: { type: integer }
        reason: { type: [string, "null"] }
        snapshot: {}
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
    AdminStatusChangeInput:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE, SUSPENDED] }
        reason: { type: string, minLength: 5, maxLength: 2000 }
    Venue:
      type: object
      required:
        [
          id,
          slug,
          name,
          location,
          cityCode,
          indoorOutdoorType,
          sport,
          sports,
          rating,
          reviewCount,
          priceFrom,
          hasPromo,
          nearestSlotStartsAt,
          paymentModes,
          distanceKm,
        ]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        slug: { type: string }
        name: { type: string }
        location: { type: string }
        cityCode: { type: [string, "null"] }
        indoorOutdoorType: { type: string, enum: [INDOOR, OUTDOOR, MIXED] }
        sport: { type: string }
        sports:
          type: array
          items: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        priceFrom: { type: integer }
        hasPromo: { type: boolean }
        promoLabel: { type: [string, "null"] }
        nearestSlotStartsAt: { type: [string, "null"], format: date-time }
        paymentModes:
          type: array
          items: { type: string, enum: [FULL, DP, PAY_AT_VENUE] }
        distanceKm: { type: [number, "null"] }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        imageUrl: { type: [string, "null"] }
        description: { type: string }
        galleryUrls:
          type: array
          items: { type: string, format: uri }
        parkingInfo: { type: [string, "null"] }
        houseRules: { type: [string, "null"] }
        timezone: { type: string }
        facilities:
          type: array
          items: { $ref: "#/components/schemas/PublicId" }
        courts:
          type: array
          items: { $ref: "#/components/schemas/CourtSummary" }
        addons:
          type: array
          items: { $ref: "#/components/schemas/VenueAddon" }
    VenueAddon:
      type: object
      required: [id, name, price]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        name: { type: string }
        price: { type: integer, minimum: 0 }
    CourtSummary:
      type: object
      required: [id, name, sport]
      properties:
        id: { $ref: "#/components/schemas/BookingReference" }
        name: { type: string }
        sport: { type: string }
        surface: { type: [string, "null"] }
    VenuePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Venue" }
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/PublicId"
            - type: "null"
    AvailabilitySlot:
      type: object
      required: [id, startsAt, endsAt, price, status]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        price: { type: integer }
        status: { type: string, enum: [AVAILABLE, HELD, BOOKED, BLOCKED] }
    CreateBookingInput:
      type: object
      required: [venueId, courtId, slotIds, paymentMode]
      properties:
        venueId: { $ref: "#/components/schemas/PublicId" }
        courtId: { $ref: "#/components/schemas/PublicId" }
        slotIds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PublicId" }
        addonIds:
          type: array
          maxItems: 10
          items: { type: string }
        paymentMode: { type: string, enum: [FULL, DP, PAY_AT_VENUE] }
        promotionCode: { type: string, minLength: 1, maxLength: 40 }
    Booking:
      type: object
      required:
        [
          id,
          venueId,
          paymentMode,
          status,
          paymentStatus,
          totalAmount,
          balanceDue,
          holdExpiresAt,
          version,
        ]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        venueId: { $ref: "#/components/schemas/PublicId" }
        paymentMode: { type: string, enum: [FULL, DP, PAY_AT_VENUE] }
        status:
          type: string
          enum:
            [
              HOLD,
              PENDING_CONFIRMATION,
              CONFIRMED,
              IN_PROGRESS,
              COMPLETED,
              CANCELLED,
              EXPIRED,
            ]
        paymentStatus:
          type: string
          enum: [UNPAID, PARTIALLY_PAID, PAID, PARTIALLY_REFUNDED, REFUNDED]
        totalAmount: { type: integer }
        balanceDue: { type: integer }
        holdExpiresAt: { type: [string, "null"], format: date-time }
        version: { type: integer }
    PaymentAttempt:
      type: object
      required: [id, bookingId, kind, amount, status, sandbox]
      properties:
        id: { $ref: "#/components/schemas/PaymentReference" }
        bookingId: { $ref: "#/components/schemas/BookingReference" }
        kind: { type: string }
        amount: { type: integer }
        status:
          { type: string, enum: [CREATED, PENDING, PAID, FAILED, EXPIRED, CANCELLED] }
        redirectUrl: { type: [string, "null"] }
        sandbox: { type: boolean, const: true }
